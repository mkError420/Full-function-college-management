<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔧 Debug Authentication</h1>
    
    <button onclick="testLogin()">Test Login (admin/admin123)</button>
    <button onclick="testWrongLogin()">Test Wrong Login</button>
    
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing login...</div>';
            
            try {
                console.log('Sending request to /auth.php');
                
                const response = await fetch('/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Login Successful!</h3>
                            <p><strong>User:</strong> ${data.user.username}</p>
                            <p><strong>Role:</strong> ${data.user.role}</p>
                            <p><strong>Token:</strong> ${data.token}</p>
                            <p><strong>Name:</strong> ${data.user.details.first_name} ${data.user.details.last_name}</p>
                            <hr>
                            <p><strong>🎯 React App Should Work Now!</strong></p>
                            <p>Go to <a href="http://localhost:3000" target="_blank">React App</a> and login with admin/admin123</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Login Failed: ${data.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function testWrongLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing wrong login...</div>';
            
            try {
                const response = await fetch('/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'wrong',
                        password: 'wrong'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result error">❌ Should not have succeeded!</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result success">✅ Correctly rejected: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
